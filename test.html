<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Agent Collaborative Sandbox</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; margin: 0; padding: 20px; display: flex; flex-direction: column; height: 100vh; }
        .header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 15px; border-bottom: 1px solid #334155; }
        .status { font-weight: bold; font-size: 14px; padding: 4px 12px; border-radius: 20px; background: #334155; color: #94a3b8; }
        .status.online { background: #064e3b; color: #34d399; }
        
        #chat-container { flex: 1; overflow-y: auto; margin: 20px 0; display: flex; flex-direction: column; gap: 15px; padding-right: 10px; }
        
        .agent-card { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 15px; transition: all 0.2s ease; }
        .agent-card.user { border-left: 4px solid #10b981; background: #064e3b22; }
        .agent-card.supervisor { border-left: 4px solid #a855f7; background: #1e1b4b; }
        .agent-card.primary { border-left: 4px solid #3b82f6; }
        .agent-card.vision { border-left: 4px solid #f59e0b; }
        
        .agent-header { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 8px; font-size: 14px; color: #94a3b8; }
        .agent-name { color: #f8fafc; }
        .agent-content { white-space: pre-wrap; line-height: 1.5; font-size: 15px; }
        
        .input-box { display: flex; gap: 10px; background: #1e293b; padding: 12px; border-radius: 10px; border: 1px solid #334155; }
        input[type="text"] { flex: 1; background: transparent; border: none; color: white; outline: none; font-size: 15px; }
        button { background: #2563eb; color: white; border: none; padding: 8px 18px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button:hover { background: #1d4ed8; }
        .file-label { cursor: pointer; padding: 8px 12px; background: #334155; border-radius: 6px; font-size: 14px; }
    </style>
</head>
<body>

    <div class="header">
        <h2>🤖 Multi-Agent Collaborative Sandbox</h2>
        <div id="status" class="status">Connecting...</div>
    </div>

    <div id="chat-container"></div>

    <div class="input-box">
        <label class="file-label" title="Attach Image">
            📷 <input type="file" id="imageInput" accept="image/*" style="display:none;" onchange="handleImageSelect(event)">
        </label>
        <span id="fileName" style="font-size:12px; color:#94a3b8; align-self:center;"></span>
        <input type="text" id="promptInput" placeholder="Type your message or upload an image..." onkeydown="if(event.key==='Enter') sendMessage()">
        <button onclick="sendMessage()">Send</button>
    </div>

    <script>
        const statusEl = document.getElementById("status");
        const chatContainer = document.getElementById("chat-container");
        let base64Image = null;
        let activeAgentCard = null;

        // Fallback to 127.0.0.1:8000 if loaded directly
        const host = window.location.host || '127.0.0.1:8000';
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${protocol}//${host}/ws`;

        console.log("🔌 Connecting to WebSocket at:", wsUrl);
        const ws = new WebSocket(wsUrl);

        ws.onopen = () => {
            console.log("✅ WebSocket Connected!");
            statusEl.innerText = "● Online";
            statusEl.classList.add("online");
        };

        ws.onerror = (err) => console.error("❌ WebSocket Error:", err);

        ws.onclose = () => {
            console.warn("🔌 WebSocket Disconnected.");
            statusEl.innerText = "● Offline";
            statusEl.classList.remove("online");
        };

        ws.onmessage = (event) => {
            try {
                const data = JSON.parse(event.data);

                if (data.type === "agent_start") {
                    const card = document.createElement("div");
                    const agentClass = data.agent.toLowerCase().includes("supervisor") ? "supervisor" : 
                                     data.agent.toLowerCase().includes("vision") ? "vision" : "primary";
                    
                    card.className = `agent-card ${agentClass}`;
                    card.innerHTML = `
                        <div class="agent-header">
                            <span class="agent-name">🤖 ${data.agent} (${data.role || 'Agent'})</span>
                        </div>
                        <div class="agent-content">${data.content || ''}</div>
                    `;
                    chatContainer.appendChild(card);
                    chatContainer.scrollTop = chatContainer.scrollHeight;
                    activeAgentCard = card.querySelector(".agent-content");

                } else if (data.type === "stream_chunk") {
                    if (activeAgentCard) {
                        activeAgentCard.innerText += data.content;
                        chatContainer.scrollTop = chatContainer.scrollHeight;
                    }
                } else if (data.type === "error") {
                    const errorCard = document.createElement("div");
                    errorCard.className = "agent-card";
                    errorCard.style.borderColor = "#ef4444";
                    errorCard.innerHTML = `<div class="agent-content" style="color:#f87171;">❌ ${data.content}</div>`;
                    chatContainer.appendChild(errorCard);
                }
            } catch (e) {
                const textCard = document.createElement("div");
                textCard.className = "agent-card";
                textCard.innerHTML = `<div class="agent-content">${event.data}</div>`;
                chatContainer.appendChild(textCard);
            }
        };

        function handleImageSelect(e) {
            const file = e.target.files[0];
            if (file) {
                document.getElementById("fileName").innerText = file.name;
                const reader = new FileReader();
                reader.onload = (event) => { base64Image = event.target.result; };
                reader.readAsDataURL(file);
            }
        }

        function sendMessage() {
            const input = document.getElementById("promptInput");
            const prompt = input.value.trim();
            if (!prompt && !base64Image) return;

            if (ws.readyState !== WebSocket.OPEN) {
                alert("WebSocket is offline. Please refresh http://127.0.0.1:8000!");
                return;
            }

            // User message bubble
            const userCard = document.createElement("div");
            userCard.className = "agent-card user";
            let contentHtml = `<strong>👤 You:</strong> ${prompt}`;
            if (base64Image) {
                contentHtml += `<br><img src="${base64Image}" style="max-width:200px; max-height:150px; margin-top:8px; border-radius:6px;">`;
            }
            userCard.innerHTML = `<div class="agent-content">${contentHtml}</div>`;
            chatContainer.appendChild(userCard);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // Send payload
            ws.send(JSON.stringify({ prompt: prompt, image: base64Image }));
            
            input.value = "";
            base64Image = null;
            document.getElementById("fileName").innerText = "";
            document.getElementById("imageInput").value = "";
        }
    </script>
</body>
</html>
